<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube TV – Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; background: #0a1a36; color: #ffffff; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <!-- Top bar: search is quiet here -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 48px 96px 0 96px; height: 72px">
    <button style="display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 28px 0 22px; border-radius: 32px; border: 2px solid rgba(255,255,255,.18); background: transparent; color: #b9cbe2; font-family: inherit; font-size: 24px; font-weight: 500; cursor: pointer" aria-label="Search (press S)" onClick="{{openSearch}}">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span>Search</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 36px; padding: 0 8px; box-sizing: border-box; border-radius: 8px; background: rgba(255,255,255,.10); color: #ffffff; font-size: 20px; font-weight: 700">S</span>
    </button>
    <nav aria-label="Library" style="display: flex; align-items: center; gap: 8px; margin-left: 40px; margin-right: auto">
      <button style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 18px; border: 0; border-radius: 28px; background: rgba(255,255,255,.12); color: #ffffff; font-family: inherit; font-size: 22px; font-weight: 600; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7M5 10v10h14V10"></path></svg>
        <span>Home</span>
      </button>
      <button style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 18px; border: 0; border-radius: 28px; background: transparent; color: #7d9ac4; font-family: inherit; font-size: 22px; font-weight: 600; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM12 7v5l3 2"></path></svg>
        <span>History</span>
      </button>
      <button style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 18px; border: 0; border-radius: 28px; background: transparent; color: #7d9ac4; font-family: inherit; font-size: 22px; font-weight: 600; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h12M3 12h12M3 18h8M17 14v7l5-3.5z"></path></svg>
        <span>Playlists</span>
      </button>
      <button style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 18px; border: 0; border-radius: 28px; background: transparent; color: #7d9ac4; font-family: inherit; font-size: 22px; font-weight: 600; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v12H3zM10 8.5l5 2.5-5 2.5zM8 21h8"></path></svg>
        <span>Subscriptions</span>
      </button>
    </nav>
    <div style="font-size: 28px; font-weight: 600; color: #b9cbe2">20:45</div>
  </div>

  <!-- Focused video details -->
  <div style="padding: 56px 96px 0 96px; height: 220px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 22px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #ed7126">Continue watching</div>
    <h1 style="margin: 0; font-size: 56px; line-height: 1.15; font-weight: 900; max-width: 1400px">{{focused.title}}</h1>
    <div style="display: flex; gap: 28px; font-size: 28px; font-weight: 500; color: #b9cbe2">
      <span>{{focused.channel}}</span><span>{{focused.dur}}</span><span>{{focused.p}}% watched</span>
    </div>
  </div>

  <!-- Row 1 -->
  <div style="padding: 48px 0 0 96px; display: flex; flex-direction: column; gap: 24px">
    <h2 style="margin: 0; font-size: 34px; font-weight: 700">Continue watching</h2>
    <div style="display: flex; gap: 40px">
      <sc-for list="{{row1}}" as="v" hint-placeholder-count="5">
        <button style="{{v.tileStyle}}" onClick="{{v.play}}" aria-label="Play {{v.title}}">
          <div style="{{v.thumbStyle}}">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="rgba(255,255,255,.35)"><path d="M8 5v14l11-7z"></path></svg>
            <span style="position: absolute; right: 12px; bottom: 12px; padding: 4px 10px; border-radius: 6px; background: rgba(0,0,0,.75); font-size: 22px; font-weight: 700">{{v.dur}}</span>
            <div style="position: absolute; left: 0; bottom: 0; height: 8px; width: 100%; background: rgba(255,255,255,.2)"><div style="{{v.progStyle}}"></div></div>
          </div>
          <div style="font-size: 26px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{v.title}}</div>
        </button>
      </sc-for>
    </div>
  </div>

  <!-- Row 2, dimmed: next in line -->
  <div style="padding: 48px 0 0 96px; display: flex; flex-direction: column; gap: 24px; opacity: .55">
    <h2 style="margin: 0; font-size: 34px; font-weight: 700">Subscriptions</h2>
    <div style="display: flex; gap: 40px">
      <sc-for list="{{row2}}" as="v" hint-placeholder-count="5">
        <div style="flex: 0 0 400px; height: 225px; border-radius: 16px; background: {{v.c}}"></div>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"focusColor":{"editor":"color","default":"#ed7126","options":["#ed7126","#ffffff","#7d9ac4"]},"onPlay":{"editor":null},"onSearch":{"editor":null},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const ring = this.props.focusColor ?? '#ed7126';
    const vids = [
      { title: 'How a CPU actually executes your code', channel: 'Core Dumped', dur: '18:42', p: 35, c: '#1d4180' },
      { title: 'Rebuilding my homelab rack from scratch', channel: 'Homelab Diaries', dur: '24:10', p: 70, c: '#2b569c' },
      { title: 'Live at Paradiso – full concert', channel: 'Paradiso Live', dur: '1:32:05', p: 15, c: '#0f2450' },
      { title: 'NixOS in 100 seconds', channel: 'Fireship', dur: '2:18', p: 50, c: '#143062' },
      { title: 'Bread baking for absolute beginners', channel: 'Kitchen Basics', dur: '31:47', p: 20, c: '#1d4180' }
    ];
    const sel = (this.state && this.state.sel) || 0;
    const row1 = vids.map((v, i) => {
      const f = i === sel;
      return {
        ...v,
        play: () => { this.setState({ sel: i }); if (this.props.onPlay) this.props.onPlay({ title: v.title, channel: v.channel, dur: v.dur, p: v.p, c: v.c }); },
        tileStyle: 'flex: 0 0 400px; display: flex; flex-direction: column; gap: 16px; transform-origin: left top; border: 0; background: none; padding: 0; margin: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;' + (f ? ' transform: scale(1.06);' : ' opacity: .8;'),
        thumbStyle: 'position: relative; height: 225px; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: ' + v.c + ';' + (f ? ' outline: 6px solid ' + ring + '; outline-offset: 4px; box-shadow: 0 24px 60px rgba(0,0,0,.5);' : ''),
        progStyle: 'height: 100%; width: ' + v.p + '%; background: ' + ring
      };
    });
    const row2 = ['#143062', '#0f2450', '#1d4180', '#143062', '#0f2450'].map(c => ({ c }));
    const openSearch = () => { if (this.props.onSearch) this.props.onSearch(); };
    return { row1, row2, openSearch, focused: vids[sel] };
  }
}
</script>
</body>
</html>
